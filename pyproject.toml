[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrna-oncology-evidence-lab"
version = "1.0.0"
description = "Reproducible evidence audit of the Moderna-Merck mRNA oncology narrative"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "matplotlib==3.8.4",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
